# Lean Linux desktop build for the SB20-buttons feature branch.
# Adapted from the upstream `linux-x86-build` job in main.yml (same proven recipe),
# trimmed to just build + unit-test on a hosted ubuntu-24.04 runner so we get a fast
# compile loop while developing. Later this can be retargeted at the self-hosted
# `qz-build` runner (runs-on: [self-hosted, qz-build]) once cauldnz-pos #10 provisions it.
name: CI Linux Desktop (fork)

env:
  DISPLAY: ':99'
  ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'

on:
  workflow_dispatch:
  push:
    branches: [ "feat/**" ]

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-desktop-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Xvfb install and run
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          Xvfb -ac ${{ env.DISPLAY }} -screen 0 1280x780x24 &

      - uses: actions/checkout@v4

      - name: Checkout smtpclient submodule
        uses: actions/checkout@v4
        with:
          repository: bluetiger9/SmtpClient-for-Qt
          path: "src/smtpclient/"
          ref: 3fa4a0fe5797070339422cf18b5e9ed8dcb91f9c

      - name: Checkout googletest submodule
        uses: actions/checkout@v4
        with:
          repository: google/googletest
          path: "tst/googletest/"
          ref: "release-1.12.1"

      - name: Checkout qHttpServer submodule
        uses: actions/checkout@v4
        with:
          repository: qt-labs/qthttpserver
          path: "src/qthttpserver"

      - name: Install system Qt5 + build packages
        run: |
          sudo apt update -y
          sudo apt-get install -y qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools \
            qtquickcontrols2-5-dev libqt5bluetooth5 libqt5widgets5 libqt5positioning5 libqt5xml5 \
            qtconnectivity5-dev qtpositioning5-dev libqt5charts5-dev libqt5charts5 \
            libqt5networkauth5-dev "libqt5websockets5*" \
            libxcb-randr0-dev libxcb-xtest0-dev libxcb-xinerama0-dev libxcb-shape0-dev libxcb-xkb-dev \
            libqt5sql5-sqlite libqt5sql5 libqt5sql5-mysql libqt5sql5-psql

      - name: Install Qt 5.15.2 (qmake toolchain)
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'linux'
          modules: 'qtnetworkauth qtcharts'
          cache: 'true'
          cache-key-prefix: 'install-qt-action-linux'

      - name: Prepare qthttpserver 3rd-party headers
        run: cp qHttpServerBin/5.15.2/headers/* src/qthttpserver/src/3rdparty/http-parser/

      - name: Build + install qthttpserver
        run: |
          cd src/qthttpserver
          qmake
          make -j"$(nproc)"
          make install
          cd ../..

      - name: Compile Linux desktop
        run: |
          qmake
          make -j"$(nproc)"

      - name: Archive linux-desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-binary
          path: src/qdomyos-zwift

      - name: Unit tests
        run: |
          cd tst
          GTEST_OUTPUT=xml:test-results/ GTEST_COLOR=1 ./qdomyos-zwift-tests
          cd ..
